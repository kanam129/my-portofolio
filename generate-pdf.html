<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khoirul Anam - CV - Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       GLOBAL RESET
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:        #111827;
      --ink-mid:    #374151;
      --ink-light:  #6b7280;
      --ink-faint:  #9ca3af;
      --border:     #e5e7eb;
      --border-mid: #d1d5db;
      --page-bg:    #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #f3f4f6;
    }

    /* =============================================
       CONTROL BAR (screen only)
    ============================================= */
    .control-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      background: #1a1f2e;
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }
    .control-logo {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .control-hint { font-size: 0.78rem; color: #64748b; margin-left: 12px; }
    .control-actions { display: flex; gap: 10px; }
    .btn-back {
      background: transparent; color: #94a3b8; border: 1px solid #334155;
      font-size: 0.82rem; font-weight: 600; padding: 9px 16px; border-radius: 7px;
      cursor: pointer; font-family: 'Inter', sans-serif; transition: color .2s;
    }
    .btn-back:hover { color: #fff; border-color: #64748b; }
    .btn-print {
      background: #111827; color: #fff;
      border: none; font-size: 0.82rem; font-weight: 600; padding: 9px 18px;
      border-radius: 7px; cursor: pointer; font-family: 'Inter', sans-serif;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-print:hover { background: #374151; }

    /* PRINT TIP */
    .print-tip {
      background: #f8fafc; color: #64748b; font-size: 0.75rem;
      padding: 8px 32px; border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      position: fixed; top: 49px; left: 0; right: 0; z-index: 998;
    }
    .print-tip strong { color: #374151; }

    /* =============================================
       PAPER WRAPPER (screen only)
    ============================================= */
    .paper-wrapper {
      padding: 110px 32px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* =============================================
       PAGE — A4 PORTRAIT
    ============================================= */
    .page {
      width: 210mm;
      height: 297mm;
      overflow: hidden;
      background: var(--page-bg);
      position: relative;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      box-shadow: 0 4px 32px rgba(0,0,0,0.12);
      border-radius: 2px;
    }

    /* =============================================
       PAGE 1 LAYOUT — single column (ATS-safe)
    ============================================= */
    .p1-layout {
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* Header block */
    .cv-header { margin-bottom: 14px; }
    .cv-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .cv-header-text { flex: 1; }
    .cv-header-photo {
      width: 60px;
      height: 75px;
      border-radius: 4px;
      object-fit: cover;
      object-position: center top;
      border: 1px solid var(--border-mid);
      flex-shrink: 0;
      display: block;
    }
    .cv-header-name {
      font-family: 'Outfit', sans-serif;
      font-size: 20pt; font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.1;
    }
    .cv-header-role {
      font-size: 9pt; font-weight: 500;
      color: var(--ink-light);
      letter-spacing: 0.04em;
      margin-top: 3px;
    }
    .cv-contact-row {
      display: flex; flex-wrap: wrap; gap: 4px 16px;
      margin-top: 8px;
    }
    .cv-contact-row a {
      font-size: 8pt; color: var(--ink-mid);
      text-decoration: none;
    }
    .cv-contact-row a:hover { text-decoration: underline; }
    .cv-contact-sep { font-size: 8pt; color: var(--ink-faint); }

    .cv-header-divider {
      width: 100%; height: 1.5px;
      background: var(--ink);
      margin: 12px 0;
    }

    /* Section */
    .cv-section { margin-bottom: 14px; }

    /* Section title */
    .cv-title {
      font-family: 'Outfit', sans-serif; font-size: 8pt;
      font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink); display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .cv-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Summary */
    .cv-summary { font-size: 8.5pt; color: var(--ink-mid); line-height: 1.75; }

    /* Skills — plain comma-separated, ATS reads this cleanly */
    .cv-skills-text { font-size: 8pt; color: var(--ink-mid); line-height: 1.8; }

    /* Experience */
    .exp-item { margin-bottom: 10px; }
    .exp-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
    .exp-role { font-size: 9.5pt; font-weight: 700; color: var(--ink); }
    .exp-period { font-size: 7.5pt; font-weight: 500; color: var(--ink-light); }
    .exp-company { font-size: 8pt; font-weight: 500; color: var(--ink-mid); margin-bottom: 4px; }
    .exp-desc { font-size: 7.5pt; color: var(--ink-mid); line-height: 1.65; }

    /* Education */
    .edu-item { margin-bottom: 10px; }
    .edu-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
    .edu-degree { font-size: 9.5pt; font-weight: 700; color: var(--ink); }
    .edu-period { font-size: 7.5pt; font-weight: 500; color: var(--ink-light); }
    .edu-inst { font-size: 8pt; font-weight: 500; color: var(--ink-mid); margin-bottom: 4px; }
    .edu-gpa { font-size: 7.5pt; color: var(--ink-mid); margin-bottom: 3px; }
    .edu-desc { font-size: 7.5pt; color: var(--ink-mid); line-height: 1.65; }
    .edu-achievements { list-style: none; display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
    .edu-achievements li { font-size: 7pt; color: var(--ink-mid); padding-left: 12px; position: relative; }
    .edu-achievements li::before { content: '–'; position: absolute; left: 0; color: var(--ink-faint); }

    /* =============================================
       PAGE 2+ — Projects (single column, ATS-safe)
    ============================================= */
    .page-projects { padding: 28px 32px; }

    .proj-page-header {
      display: flex; justify-content: space-between; align-items: baseline;
      padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); margin-bottom: 14px;
      flex-shrink: 0;
    }
    .proj-page-title {
      font-family: 'Outfit', sans-serif; font-size: 11pt; font-weight: 800;
      letter-spacing: -0.01em; color: var(--ink);
    }
    .proj-page-sub { font-size: 8pt; color: var(--ink-faint); }

    /* Single column project list — ATS reads line by line */
    .projects-list { display: flex; flex-direction: column; gap: 10px; }

    .project-block {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .project-block:last-child { border-bottom: none; }
    .pb-header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px; }
    .pb-title { font-family: 'Outfit', sans-serif; font-size: 9.5pt; font-weight: 700; color: var(--ink); }
    .pb-stack-inline { font-size: 7.5pt; color: var(--ink-faint); font-style: italic; }
    .pb-desc { font-size: 7.5pt; color: var(--ink-mid); line-height: 1.6; margin-top: 3px; }
    .pb-tags-text { font-size: 7pt; color: var(--ink-faint); margin-top: 3px; }

    .proj-page-footer {
      margin-top: 12px; padding-top: 8px;
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between;
    }
    .proj-page-footer span { font-size: 7.5pt; color: var(--ink-faint); }

    /* =============================================
       PRINT RULES
    ============================================= */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        background: transparent !important;
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        padding: 0 !important;
      }

      .control-bar,
      .print-tip { display: none !important; }

      .paper-wrapper {
        padding: 0 !important;
        gap: 0 !important;
        display: block !important;
      }

      .page {
        box-shadow: none !important;
        border-radius: 0 !important;
        width: 210mm !important;
        height: 297mm !important;
        overflow: hidden !important;
        margin: 0 !important;
        page-break-after: always;
        break-after: page;
      }

      .page:last-child {
        page-break-after: avoid;
        break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- CONTROL BAR -->
  <div class="control-bar">
    <div style="display:flex; align-items:center;">
      <span class="control-logo">k.anam — CV</span>
      <span class="control-hint">Preview sebelum print</span>
    </div>
    <div class="control-actions">
      <button class="btn-back" onclick="window.location.href='index.html'">← Back to Site</button>
      <button class="btn-print" onclick="window.print()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save as PDF
      </button>
    </div>
  </div>

  <div class="paper-wrapper" id="paper-wrapper"></div>

  <script src="assets/js/config.js"></script>
  <script>
    const stripHtml = (html) => {
      const d = document.createElement('div');
      d.innerHTML = html;
      return d.textContent || '';
    };

    const extractStack = (ld) => {
      if (!ld) return '';
      const m = ld.match(/<h4>Technical Stack:<\/h4>\s*<p>(.*?)<\/p>/s);
      return m ? stripHtml(m[1]).trim() : '';
    };

    const ICONS = {
      mail:     `<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,12 2,6"/></svg>`,
      github:   `<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
      linkedin: `<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>`,
      instagram:`<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>`,
      globe:    `<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
      edu:      `<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
    };

    // ============================================================
    // PAGE 1 — ATS-friendly single column
    // ============================================================
    const buildPage1 = () => {
      const { name, heroSubtitle, cvDescription, heroDescription, profilePictureUrl, email, socials, skills, experience, education, careerStartYear } = config;

      const yearsExp = new Date().getFullYear() - (careerStartYear || 2022);
      const description = (cvDescription || heroDescription).replace('{years}', yearsExp);

      // Contact row — plain text links, no SVG (ATS reads text, not SVG)
      const contactItems = [
        { href: socials.website,                   text: 'kanam.web.id' },
        { href: `mailto:${email}`,                 text: email },
        { href: socials.linkedin,                  text: 'linkedin.com/in/k-anam' },
        { href: socials.github,                    text: 'github.com/kanam129' },
      ].filter(c => c.href && c.text);

      const contactHTML = contactItems.map((c, i) => {
        const sep = i < contactItems.length - 1 ? '<span class="cv-contact-sep">|</span>' : '';
        return `<a href="${c.href}" target="_blank" rel="noopener">${c.text}</a>${sep}`;
      }).join(' ');

      // Skills — comma-separated plain text (ATS keyword-scannable)
      const skillsText = skills.join(', ');

      // Experience
      const expHTML = (experience || []).map(j => `
        <div class="exp-item">
          <div class="exp-header">
            <span class="exp-role">${j.role}</span>
            <span class="exp-period">${j.period}</span>
          </div>
          <div class="exp-company">${j.company}</div>
          <p class="exp-desc">${j.description}</p>
        </div>
      `).join('');

      // Education
      const eduHTML = (education || []).map(e => `
        <div class="edu-item">
          <div class="edu-header">
            <span class="edu-degree">${e.degree} &mdash; ${e.level}</span>
            <span class="edu-period">${e.period}</span>
          </div>
          <div class="edu-inst">${e.institution}</div>
          <div class="edu-gpa">GPA: ${e.gpa} / 4.00</div>
          <p class="edu-desc">${e.description}</p>
          ${e.achievements && e.achievements.length ? `
            <ul class="edu-achievements">
              ${e.achievements.map(a => `<li>${a}</li>`).join('')}
            </ul>
          ` : ''}
        </div>
      `).join('');

      return `
        <div class="page">
          <div class="p1-layout">

            <!-- HEADER -->
            <div class="cv-header">
              <div class="cv-header-row">
                <div class="cv-header-text">
                  <p class="cv-header-name">${name}</p>
                  <p class="cv-header-role">${heroSubtitle}</p>
                  <div class="cv-contact-row">${contactHTML}</div>
                </div>
                <img src="${profilePictureUrl}" alt="${name}" class="cv-header-photo" onerror="this.style.display='none'">
              </div>
              <div class="cv-header-divider"></div>
            </div>

            <!-- SUMMARY -->
            <div class="cv-section">
              <h2 class="cv-title">Summary</h2>
              <p class="cv-summary">${description}</p>
            </div>

            <!-- SKILLS -->
            <div class="cv-section">
              <h2 class="cv-title">Technical Skills</h2>
              <p class="cv-skills-text">${skillsText}</p>
            </div>

            <!-- EXPERIENCE -->
            ${expHTML ? `
              <div class="cv-section">
                <h2 class="cv-title">Work Experience</h2>
                ${expHTML}
              </div>
            ` : ''}

            <!-- EDUCATION -->
            ${eduHTML ? `
              <div class="cv-section">
                <h2 class="cv-title">Education</h2>
                ${eduHTML}
              </div>
            ` : ''}

          </div>
        </div>
      `;
    };

    // ============================================================
    // PROJECT PAGES — single-column list, ATS-safe
    // ============================================================
    const buildProjectPages = () => {
      const { name, projects: all } = config;
      const PER_PAGE = 10;
      const pages = [];
      const totalPages = Math.ceil(all.length / PER_PAGE) + 1;

      for (let i = 0; i < all.length; i += PER_PAGE) {
        const chunk = all.slice(i, i + PER_PAGE);
        const pageNum = Math.floor(i / PER_PAGE) + 2;

        const blocksHTML = chunk.map(p => {
          const stack = extractStack(p.longDescription);
          const tagsText = p.tags.join(', ');
          return `
            <div class="project-block">
              <div class="pb-header">
                <span class="pb-title">${p.title}</span>
                ${stack ? `<span class="pb-stack-inline">${stack}</span>` : ''}
              </div>
              <p class="pb-desc">${p.description}</p>
              <p class="pb-tags-text">Tags: ${tagsText}</p>
            </div>
          `;
        }).join('');

        pages.push(`
          <div class="page">
            <div class="page-projects">
              <div class="proj-page-header">
                <span class="proj-page-title">Projects</span>
                <span class="proj-page-sub">${name} &mdash; Page ${pageNum} of ${totalPages}</span>
              </div>
              <div class="projects-list">${blocksHTML}</div>
              <div class="proj-page-footer">
                <span>Page ${pageNum} of ${totalPages}</span>
                <span>${name} &bull; ${config.email}</span>
              </div>
            </div>
          </div>
        `);
      }

      return pages.join('');
    };

    // ============================================================
    // RENDER
    // ============================================================
    const wrapper = document.getElementById('paper-wrapper');
    if (typeof config !== 'undefined') {
      wrapper.innerHTML = buildPage1() + buildProjectPages();
    } else {
      wrapper.innerHTML = '<p style="color:red;padding:40px;">Error: config.js tidak ditemukan.</p>';
    }
  </script>
</body>
</html>
